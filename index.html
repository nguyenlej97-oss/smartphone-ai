<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone AI Premium</title>
    <!-- Chèn Font và Icon cho hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        p.intro {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-option {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .btn-option:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            border-radius: 8px;
            animation: fadeIn 0.4s ease;
        }

        .result-title {
            font-weight: 700;
            color: #15803d;
            margin-top: 0;
            font-size: 18px;
        }

        .features-list {
            margin: 12px 0 0 0;
            padding-left: 20px;
            color: #1e293b;
            font-size: 14px;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="message">
        <!-- Nội dung chào mừng sẽ tự động load ở đây -->
    </div>
    
    <div id="options" class="options-grid">
        <!-- Các nút lựa chọn tư vấn sẽ load ở đây -->
    </div>

    <div id="result">
        <!-- Kết quả tư vấn chuyên nghiệp hiện ở đây -->
    </div>
</div>

<script>
    // 1. Dữ liệu tư vấn (Dễ dàng chỉnh sửa, thêm bớt điện thoại)
    const dataTuVan = {
        gaming: {
            title: "🎮 GIẢI TRÍ & CHIẾN GAME ĐỈNH CAO",
            recommend: "Samsung Galaxy A56",
            details: [
                "Màn hình Super AMOLED 120Hz mang lại trải nghiệm vuốt chạm cực kỳ mượt mà, giảm độ trễ tối đa khi combat.",
                "Hiệu năng mạnh mẽ trong phân khúc, tối ưu tốt cho các tựa game phổ biến như Liên Quân Mobile, PUBG Mobile, Free Fire.",
                "Hệ thống tản nhiệt cải tiến giúp duy trì FPS ổn định và viên pin 5000mAh cho thời gian chơi game bền bỉ cả ngày."
            ]
        },
        camera: {
            title: "📸 NHIẾP ẢNH & SÁNG TẠO NỘI DUNG",
            recommend: "iPhone 13 Pro hoặc Samsung Galaxy S23 FE",
            details: [
                "Hệ thống camera cao cấp hỗ trợ chống rung quang học OIS, bắt trọn khoảnh khắc sắc nét ngay cả trong điều kiện thiếu sáng.",
                "Khả năng quay video chuẩn cinematic, màu sắc chân thực, phù hợp cho các bạn làm sáng tạo nội dung (Tiktok, Reels).",
                "Tính năng xử lý AI thông minh giúp tối ưu hóa màu da và phong cảnh tự động ngay sau khi chụp."
            ]
        },
        battery: {
            title: "🔋 CÔNG VIỆC DI CHUYỂN & PIN TRÂU",
            recommend: "Xiaomi Redmi Note 13 Pro+",
            details: [
                "Dung lượng pin lớn kết hợp thuật toán tiết kiệm điện năng, đáp ứng từ 1.5 đến 2 ngày sử dụng tần suất cao.",
                "Công nghệ sạc siêu nhanh giúp nạp lại năng lượng chỉ trong vòng 20-30 phút, tối ưu cho người bận rộn.",
                "Độ bền đạt chuẩn, bắt sóng khỏe và kết nối 5G ổn định khi di chuyển liên tục."
            ]
        },
        budget: {
            title: "💰 TỐI ƯU CHI PHÍ / HỌC TẬP",
            recommend: "Oppo A78 hoặc Vivo Y36",
            details: [
                "Mức giá tiếp cận dễ dàng nhưng sở hữu thiết kế thời thượng, mỏng nhẹ và trẻ trung.",
                "Cấu hình mượt mà cho các tác vụ hàng ngày: lướt web, học trực tuyến, xem phim và sử dụng mạng xã hội.",
                "Chế độ bảo hành chính hãng dài hạn, linh kiện thay thế dễ tìm và tiết kiệm."
            ]
        }
    };

    // 2. Hàm khởi tạo giao diện ban đầu
    function khoiTaoTuVan() {
        // Hiện thông điệp chào mừng chuyên nghiệp
        document.getElementById("message").innerHTML = `
            <h1>🤖 SMARTPHONE AI PREMIUM</h1>
            <p class="intro">
                Xin chào quý khách. <strong>SmartPhone AI</strong> sẽ hỗ trợ phân tích và đề xuất sản phẩm phù hợp nhất 
                dựa trên nhu cầu thực tế, ngân sách và thói quen sử dụng của bạn. Vui lòng chọn tiêu chí bạn ưu tiên nhất bên dưới:
            </p>
        `;

        // Hiện các nút lựa chọn một cách sạch sẽ bằng vòng lặp, không bị lỗi dấu nháy
        document.getElementById("options").innerHTML = `
            <button class="btn-option" onclick="hienKetQua('gaming')">🎮 Tối ưu chơi game</button>
            <button class="btn-option" onclick="hienKetQua('camera')">📸 Chụp ảnh, Quay phim</button>
            <button class="btn-option" onclick="hienKetQua('battery')">🔋 Pin trâu & Sạc nhanh</button>
            <button class="btn-option" onclick="hienKetQua('budget')">💰 Giá tốt / Học tập</button>
        `;
    }

    // 3. Hàm xử lý hiển thị kết quả tư vấn chuyên nghiệp
    function hienKetQua(key) {
        const luaChon = dataTuVan[key];
        
        let danhSachDiemNoiBat = "";
        luaChon.details.forEach(item => {
            danhSachDiemNoiBat += `<li>${item}</li>`;
        });

        document.getElementById("result").innerHTML = `
            <div class="result-box">
                <h3 class="result-title">${luaChon.title}</h3>
                <p>Dựa trên nhu cầu của bạn, <strong>SmartPhone AI</strong> đề xuất dòng sản phẩm: <strong>${luaChon.recommend}</strong></p>
                <strong style="font-size: 14px; color: #16a34a;">✨ Ưu điểm cốt lõi lý giải cho đề xuất này:</strong>
                <ul class="features-list">
                    ${danhSachDiemNoiBat}
                </ul>
            </div>
        `;
    }

    // Tự động chạy khi trang web load xong
    window.onload = khoiTaoTuVan;
</script>

</body>
</html>
