<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPhone AI</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    padding:30px;
}

.chatbox{
    width:500px;
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
}

#message{
    padding:15px;
    background:#f0f2f5;
    border-radius:10px;
    margin-bottom:15px;
    min-height:60px;
}

button{
    width:100%;
    padding:12px;
    margin:5px 0;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}
</style>
</head>

<body>

<div class="chatbox">

<h2>📱 SmartPhone AI</h2>

<div id="message">
Chào mừng đến Smart Store!<br><br>
Vui lòng chọn chức năng:
</div>

<div id="options"></div>

</div>

<script>

function menuChinh(){

document.getElementById("message").innerHTML=
"📱 Chào mừng đến Smart Store!<br><br>Vui lòng chọn chức năng:";

document.getElementById("options").innerHTML=`

<button onclick="tuVan()">📱 Tư vấn điện thoại</button>

<button onclick="bangGia()">💰 Bảng giá</button>

<button onclick="khuyenMai()">🎁 Khuyến mãi</button>

<button onclick="baoHanh()">🛡️ Bảo hành</button>

<button onclick="lienHe()">📞 Liên hệ</button>

`;

}

function tuVan(){

document.getElementById("message").innerHTML=
"📱 Bạn cần điện thoại cho mục đích nào?";

document.getElementById("options").innerHTML=`

<button onclick="game()">🎮 Chơi game</button>

<button onclick="camera()">📸 Chụp ảnh</button>

<button onclick="hocTap()">📚 Học tập</button>

<button onclick="menuChinh()">⬅ Quay lại</button>

`;

}

function game(){

document.getElementById("message").innerHTML=
"🎮 Gợi ý:<br><br>• POCO X7 Pro<br>• Redmi Note 14 Pro<br>• Samsung Galaxy A56";

}

function camera(){

document.getElementById("message").innerHTML=
"📸 Gợi ý:<br><br>• iPhone 15<br>• OPPO Reno 14<br>• Vivo V50";

}

function hocTap(){

document.getElementById("message").innerHTML=
"📚 Gợi ý:<br><br>• Samsung Galaxy A36<br>• Xiaomi Redmi Note 14<br>• iPhone 14";

}

function bangGia(){

document.getElementById("message").innerHTML=
"💰 BẢNG GIÁ THAM KHẢO<br><br>iPhone 15: 17.990.000đ<br>Samsung Galaxy A56: 8.990.000đ<br>OPPO Reno 14: 10.990.000đ";

document.getElementById("options").innerHTML=
'<button onclick="menuChinh()">⬅ Quay lại</button>';

}

function khuyenMai(){

document.getElementById("message").innerHTML=
"🎁 KHUYẾN MÃI<br><br>• Giảm giá đến 15%<br>• Trả góp 0%<br>• Tặng tai nghe Bluetooth";

document.getElementById("options").innerHTML=
'<button onclick="menuChinh()">⬅ Quay lại</button>';

}

function baoHanh(){

document.getElementById("message").innerHTML=
"🛡️ Vui lòng liên hệ cửa hàng để kiểm tra bảo hành bằng IMEI.";

document.getElementById("options").innerHTML=
'<button onclick="menuChinh()">⬅ Quay lại</button>';

}

function lienHe(){

document.getElementById("message").innerHTML=
"📞 Hotline: 1900 1234<br>Email: support@smartstore.vn";

document.getElementById("options").innerHTML=
'<button onclick="menuChinh()">⬅ Quay lại</button>';

}

menuChinh();

</script>

</body>
</html>
